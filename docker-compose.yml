services:
  db:
    image: postgres:16-alpine
    container_name: pollyspop-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pollyspop
    volumes:
      - pollyspop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pollyspop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pollyspop_pgdata:
